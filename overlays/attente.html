<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Le stream commence bientôt</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css"></head>
<body>
<div class="scene">
  <div class="bg" style="background-image:url(img/fond.jpg)"></div>
  <div class="embers"></div>
  <div class="logo" style="position:absolute;z-index:2;top:48px;left:64px;font-size:54px">wow<span>forever</span></div>
  <div class="plate" style="z-index:2;top:58px;right:64px;font-size:26px">Live de <span data-nom></span></div>
  <div class="parchment" style="position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:1560px;padding:30px 48px;display:flex;align-items:center;gap:44px">
    <div style="flex:1;text-align:left">
      <div class="title" style="font-size:58px" data-ready>Le stream commence bientôt</div>
      <div class="sub" style="font-size:24px;margin:6px 0 14px">Prends ta chope, installe-toi près du feu…</div>
      <div class="tip" data-tips style="font-size:24px;min-height:62px"></div>
    </div>
    <div class="timer" data-timer><div><b>10</b><span>Minutes</span></div><div><b>00</b><span>Secondes</span></div></div>
  </div>
</div>
<script src="overlay.js"></script>
</body></html>
