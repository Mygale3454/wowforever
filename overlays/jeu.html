<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Overlay en jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  /* Encadré en bas à gauche : héros + derniers soutiens, bien contrasté sur le jeu */
  .panel{position:absolute;left:24px;bottom:24px;display:flex;align-items:flex-end}
  .hero{position:relative;z-index:3;width:230px;height:330px;margin-right:-70px;margin-bottom:-6px;
    display:flex;align-items:flex-end;justify-content:center}
  .hero img{max-width:100%;max-height:100%;object-fit:contain;
    filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 14px rgba(255,200,90,.55)) drop-shadow(0 12px 18px rgba(0,0,0,.8))}
  .hero .aura{position:absolute;left:10%;right:10%;bottom:0;height:60%;border-radius:50%;
    background:radial-gradient(ellipse at 50% 70%,rgba(255,190,70,.55),rgba(255,190,70,0) 70%);animation:pulse 3.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}

  .board{position:relative;z-index:1;width:440px;padding:0 18px 16px 82px;border-radius:16px;
    background:linear-gradient(180deg,#1c120a 0%,#120b05 100%);
    border:4px solid #f2c25a;outline:2px solid #5a3a12;outline-offset:3px;
    box-shadow:inset 0 0 0 2px #7a5218,inset 0 0 40px rgba(242,194,90,.12),0 0 24px rgba(242,194,90,.35),0 16px 34px rgba(0,0,0,.85)}
  .title{margin:0 -18px 10px -82px;padding:10px 18px 9px 82px;border-radius:11px 11px 0 0;
    background:linear-gradient(90deg,#8a5d16,#e3b04b 55%,#8a5d16);color:#1c120a;
    font-family:Cinzel,serif;font-weight:900;font-size:20px;letter-spacing:.5px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,240,200,.6)}
  .who{font-family:Cinzel,serif;font-weight:800;font-size:15px;color:#9fd4ff;margin:-4px 0 8px;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:7px 0;border-radius:10px;
    background:linear-gradient(90deg,rgba(242,194,90,.22),rgba(242,194,90,.06));border:1px solid rgba(242,194,90,.7)}
  .row img{width:42px;height:42px;flex:0 0 42px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
  .row div{min-width:0}
  .row small{display:block;font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#f2d38f}
  .row b{display:block;font-family:Cinzel,serif;font-weight:900;font-size:27px;color:#fff;line-height:1.1;
    text-shadow:0 0 2px #000,0 2px 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{background:rgba(242,194,90,.9);transform:scale(1.05)}100%{transform:scale(1)}}
  #cam{display:none;left:28px;bottom:330px;width:320px;height:180px}
  body.cam #cam{display:block}
</style></head>
<body>
<!-- Fond transparent : à placer AU-DESSUS de la capture du jeu dans OBS -->
<div class="frame" id="cam"></div>

<div class="panel">
  <div class="hero"><div class="aura"></div><img src="img/heros.webp" alt="" data-img></div>
  <div class="board">
    <div class="title">Merci pour le soutien !</div>
    <div class="who" data-perso>Mygale <span>Araneae</span></div>
    <div class="row"><img src="img/ic-hauts-faits.webp" alt=""><div><small>Dernier abonné</small><b data-k="sub">—</b></div></div>
    <div class="row"><img src="img/ic-trophee.webp" alt=""><div><small>Derniers abos offerts</small><b data-k="gift">—</b></div></div>
    <div class="row"><img src="img/ic-or.webp" alt=""><div><small>Derniers bits</small><b data-k="bits">—</b></div></div>
  </div>
</div>

<script src="overlay.js"></script>
<script>
  /* Réglages par l'adresse : ?sub=Pseudo&gift=Pseudo&bits=Pseudo&cam=1&perso=Nom%20Prénom
     Mise à jour automatique avec Streamlabs : ?slt=TON_JETON_SOCKET_API */
  const q = new URLSearchParams(location.search);
  const KEY = "wowforever-soutiens";
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const set = (k, v, save) => {
    if (!v) return;
    const el = document.querySelector(`[data-k="${k}"]`);
    el.textContent = v;
    const r = el.closest(".row"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
    if (save) { mem[k] = v; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  };
  ["sub", "gift", "bits"].forEach(k => { const v = q.get(k) || mem[k]; if (v) document.querySelector(`[data-k="${k}"]`).textContent = v; });
  if (q.get("cam") === "1") document.body.classList.add("cam");
  if (q.get("img")) document.querySelector("[data-img]").src = q.get("img");
  if (q.get("perso")) {
    const [a, ...b] = q.get("perso").split(" ");
    document.querySelector("[data-perso]").textContent = q.get("perso");
  }

  /* ----- Connexion à Streamlabs (événements en direct) ----- */
  const token = q.get("slt");
  if (token) {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js";
    sc.onload = () => {
      const socket = io(`https://sockets.streamlabs.com?token=${encodeURIComponent(token)}`, { transports: ["websocket"] });
      socket.on("event", ev => {
        if (!ev || (ev.for && ev.for !== "twitch_account")) return;
        (Array.isArray(ev.message) ? ev.message : [ev.message]).forEach(m => {
          if (!m) return;
          const name = m.display_name || m.name;
          const gifter = m.gifter_display_name || m.gifter || m.gifter_name;
          if (ev.type === "bits") set("bits", `${name} (${m.amount})`, true);
          else if (ev.type === "subMysteryGift") set("gift", `${gifter || name}${m.amount ? " ×" + m.amount : ""}`, true);
          else if (ev.type === "subscription" || ev.type === "resub") {
            if (gifter) set("gift", gifter, true); else set("sub", name, true);
          }
        });
      });
    };
    document.head.appendChild(sc);
  }
</script>
</body></html>
