<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Overlay en jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  /* Encadré en bas à gauche : portrait de l'éolide + derniers soutiens */
  .panel{position:absolute;left:28px;bottom:28px;display:flex;align-items:flex-end;gap:0}
  .portrait{position:relative;z-index:2;width:250px;height:250px;margin-right:-34px}
  .portrait .ring{position:absolute;inset:0;border-radius:50%;padding:7px;
    background:conic-gradient(from 210deg,#8a5d16,#f2c25a,#fff2c4,#c9922e,#8a5d16,#f2c25a,#8a5d16);
    box-shadow:0 0 0 5px #2b1d0e,0 0 0 7px #8a5d16,0 0 30px rgba(120,190,255,.45),0 14px 30px rgba(0,0,0,.6)}
  .portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #2b1d0e}
  .portrait .glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(130,200,255,.0) 55%,rgba(130,200,255,.35) 70%,transparent 74%);animation:pulse 3.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}
  .portrait .gem{position:absolute;left:50%;top:-12px;transform:translateX(-50%) rotate(45deg);width:26px;height:26px;background:linear-gradient(135deg,#bfe6ff,#4f8fd9);border:3px solid #f2c25a;box-shadow:0 0 12px #7fc4ff}
  .portrait .who{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);white-space:nowrap;
    padding:5px 18px;border-radius:9px;background:linear-gradient(#4a3119,#3a2614);border:2px solid #c9922e;
    font-family:Cinzel,serif;font-weight:800;font-size:19px;color:#f6e7c4;box-shadow:0 6px 14px rgba(0,0,0,.5)}
  .portrait .who span{color:#9fd4ff}

  .board{position:relative;z-index:1;width:330px;padding:14px 18px 14px 54px;border-radius:14px;
    background:linear-gradient(rgba(43,29,14,.92),rgba(30,20,9,.94));border:3px solid #c9922e;
    box-shadow:inset 0 0 0 2px rgba(242,194,90,.25),0 12px 30px rgba(0,0,0,.55)}
  .board::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:2px;background:linear-gradient(90deg,transparent,#f2c25a,transparent)}
  .row{padding:7px 12px 8px;margin:6px 0;border-radius:8px;
    background:linear-gradient(90deg,rgba(242,194,90,.14),rgba(242,194,90,.04));border:1px solid rgba(201,146,46,.55)}
  .row small{display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#c9b07a}
  .row b{display:block;font-family:Cinzel,serif;font-weight:900;font-size:24px;color:#fff3d6;line-height:1.15;
    text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row:nth-child(1) b{color:#f2c25a}

  /* Cadre webcam facultatif (?cam=1) au-dessus de l'encadré */
  .row.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{background:rgba(242,194,90,.75);transform:scale(1.04)}100%{transform:scale(1)}}
  #cam{display:none;left:28px;bottom:300px;width:320px;height:180px}
  body.cam #cam{display:block}
</style></head>
<body>
<!-- Fond transparent : à placer AU-DESSUS de la capture du jeu dans OBS -->
<div class="frame" id="cam"></div>

<div class="panel">
  <div class="portrait">
    <div class="glow"></div>
    <div class="ring"><img src="img/mygale.jpg" alt=""></div>
    <div class="gem"></div>
    <div class="who" data-perso>Mygale <span>Araneae</span></div>
  </div>
  <div class="board">
    <div class="row"><small>Dernier abonné</small><b data-k="sub">—</b></div>
    <div class="row"><small>Derniers abos offerts</small><b data-k="gift">—</b></div>
    <div class="row"><small>Derniers bits</small><b data-k="bits">—</b></div>
  </div>
</div>

<script src="overlay.js"></script>
<script>
  /* Réglages par l'adresse : ?sub=Pseudo&gift=Pseudo&bits=Pseudo&cam=1&perso=Nom%20Prénom
     Mise à jour automatique avec Streamlabs : ?slt=TON_JETON_SOCKET_API */
  const q = new URLSearchParams(location.search);
  const KEY = "wowforever-soutiens";
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const set = (k, v, save) => {
    if (!v) return;
    const el = document.querySelector(`[data-k="${k}"]`);
    el.textContent = v;
    el.parentElement.classList.remove("flash"); void el.offsetWidth; el.parentElement.classList.add("flash");
    if (save) { mem[k] = v; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  };
  ["sub", "gift", "bits"].forEach(k => { const v = q.get(k) || mem[k]; if (v) document.querySelector(`[data-k="${k}"]`).textContent = v; });
  if (q.get("cam") === "1") document.body.classList.add("cam");
  if (q.get("perso")) {
    const [a, ...b] = q.get("perso").split(" ");
    document.querySelector("[data-perso]").innerHTML = `${a} <span>${b.join(" ")}</span>`;
  }

  /* ----- Connexion à Streamlabs (événements en direct) ----- */
  const token = q.get("slt");
  if (token) {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js";
    sc.onload = () => {
      const socket = io(`https://sockets.streamlabs.com?token=${encodeURIComponent(token)}`, { transports: ["websocket"] });
      socket.on("event", ev => {
        if (!ev || (ev.for && ev.for !== "twitch_account")) return;
        (Array.isArray(ev.message) ? ev.message : [ev.message]).forEach(m => {
          if (!m) return;
          const name = m.display_name || m.name;
          const gifter = m.gifter_display_name || m.gifter || m.gifter_name;
          if (ev.type === "bits") set("bits", `${name} (${m.amount})`, true);
          else if (ev.type === "subMysteryGift") set("gift", `${gifter || name}${m.amount ? " ×" + m.amount : ""}`, true);
          else if (ev.type === "subscription" || ev.type === "resub") {
            if (gifter) set("gift", gifter, true); else set("sub", name, true);
          }
        });
      });
    };
    document.head.appendChild(sc);
  }
</script>
</body></html>
