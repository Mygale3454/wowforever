<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Overlay en jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  /* Tableau des soutiens (illustration de Mygale), en bas à gauche ; les pseudos s'écrivent dans les cases */
  .panel{position:absolute;left:24px;bottom:24px;width:760px;aspect-ratio:1692/930;
    background:url(img/soutiens.png) center/contain no-repeat;filter:drop-shadow(0 10px 22px rgba(0,0,0,.75))}
  .row{position:absolute;left:16.4%;width:48.6%;height:9.4%;display:flex;align-items:center;padding:0 14px;box-sizing:border-box;border-radius:8px}
  .row b{display:block;width:100%;font-family:Cinzel,serif;font-weight:900;font-size:27px;color:#fff;line-height:1;
    text-shadow:0 0 2px #000,0 2px 6px #000,0 0 12px rgba(190,120,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r1{top:34.6%}.r2{top:55.4%}.r3{top:76.5%}
  .row.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{background:rgba(242,194,90,.75);transform:scale(1.05)}100%{background:transparent;transform:scale(1)}}
  #cam{display:none;left:28px;bottom:460px;width:320px;height:180px}
  body.cam #cam{display:block}
</style></head>
<body>
<!-- Fond transparent : à placer AU-DESSUS de la capture du jeu dans OBS -->
<div class="frame" id="cam"></div>

<div class="panel">
  <div class="row r1"><b data-k="sub"></b></div>
  <div class="row r2"><b data-k="gift"></b></div>
  <div class="row r3"><b data-k="bits"></b></div>
</div>

<script src="overlay.js"></script>
<script>
  /* Réglages par l'adresse : ?sub=Pseudo&gift=Pseudo&bits=Pseudo&cam=1
     Mise à jour automatique avec Streamlabs : ?slt=TON_JETON_SOCKET_API */
  const q = new URLSearchParams(location.search);
  const KEY = "wowforever-soutiens";
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const set = (k, v, save) => {
    if (!v) return;
    const el = document.querySelector(`[data-k="${k}"]`);
    el.textContent = v;
    const r = el.closest(".row"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
    if (save) { mem[k] = v; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  };
  ["sub", "gift", "bits"].forEach(k => { const v = q.get(k) || mem[k]; if (v) document.querySelector(`[data-k="${k}"]`).textContent = v; });
  if (q.get("cam") === "1") document.body.classList.add("cam");

  /* ----- Connexion à Streamlabs (événements en direct) ----- */
  const token = q.get("slt");
  if (token) {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js";
    sc.onload = () => {
      const socket = io(`https://sockets.streamlabs.com?token=${encodeURIComponent(token)}`, { transports: ["websocket"] });
      socket.on("event", ev => {
        if (!ev || (ev.for && ev.for !== "twitch_account")) return;
        (Array.isArray(ev.message) ? ev.message : [ev.message]).forEach(m => {
          if (!m) return;
          const name = m.display_name || m.name;
          const gifter = m.gifter_display_name || m.gifter || m.gifter_name;
          if (ev.type === "bits") set("bits", `${name} (${m.amount})`, true);
          else if (ev.type === "subMysteryGift") set("gift", `${gifter || name}${m.amount ? " ×" + m.amount : ""}`, true);
          else if (ev.type === "subscription" || ev.type === "resub") {
            if (gifter) set("gift", gifter, true); else set("sub", name, true);
          }
        });
      });
    };
    document.head.appendChild(sc);
  }
</script>
</body></html>
