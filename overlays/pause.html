<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Pause</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
<style>
  .scene .bg{inset:0;animation:zoom 30s ease-in-out infinite alternate}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.05)}}
  .scene .bg{transform-origin:20% 40%}
  .scene::after{background:radial-gradient(ellipse at 45% 45%,transparent 50%,rgba(15,9,3,.55) 100%)}
  .sign{position:absolute;z-index:3;left:50%;bottom:46px;transform-origin:50% -60px;animation:swing 6s ease-in-out infinite;
    padding:26px 70px 30px;border-radius:22px;text-align:center;
    background:repeating-linear-gradient(0deg,transparent 0 58px,rgba(40,22,8,.35) 58px 61px),linear-gradient(#8a5a2b,#5a3617);
    border:8px solid #2e1a09;box-shadow:inset 0 0 0 4px #c9922e,0 18px 40px rgba(0,0,0,.6)}
  @keyframes swing{0%,100%{transform:translateX(-50%) rotate(.8deg)}50%{transform:translateX(-50%) rotate(-.8deg)}}
  .sign b{display:block;font-family:Cinzel,serif;font-weight:900;color:#f6d77e;line-height:1.1;
    text-shadow:0 3px 0 #3a2208,0 0 18px rgba(0,0,0,.6);-webkit-text-stroke:2px #3a2208;paint-order:stroke fill}
  .sign .l1{font-size:46px}.sign .l2{font-size:72px}
  .sign::before,.sign::after{content:"";position:absolute;top:18px;width:14px;height:14px;border-radius:50%;background:#c9922e;box-shadow:0 0 0 3px #2e1a09}
  .sign::before{left:22px}.sign::after{right:22px}
</style></head>
<body>
<div class="scene">
  <div class="bg" style="background-image:url(img/nain.jpg);background-position:left center;transform-origin:left center"></div>
  <div class="embers"></div>
  <div class="sign"><b class="l1">C'est l'heure du</b><b class="l2">rafraîchissement !</b></div>
</div>
<script src="overlay.js"></script>
</body></html>
