<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="Fermer">×</button>
  <button class="lb-prev" aria-label="Précédente">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-next" aria-label="Suivante">›</button>
  <p id="lb-cap"></p>
</div>
<script>
const figs=[...document.querySelectorAll(".gal-item")], lb=document.getElementById("lightbox");
let cur=0;
function show(i){cur=(i+figs.length)%figs.length;const im=figs[cur].querySelector("img");
  document.getElementById("lb-img").src=im.src;document.getElementById("lb-cap").textContent=im.alt;lb.hidden=false;}
figs.forEach((f,i)=>f.onclick=()=>show(i));
lb.querySelector(".lb-close").onclick=()=>lb.hidden=true;
lb.querySelector(".lb-prev").onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector(".lb-next").onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.hidden=true};
document.addEventListener("keydown",e=>{if(lb.hidden)return;if(e.key==="Escape")lb.hidden=true;if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
</script>
